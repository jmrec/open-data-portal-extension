[project]
name = "open-data-portal-extension"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Miguel Recondo", email = "134484809+jmrec@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.163.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "typer>=0.29.1",
]

[project.scripts]
open-data-portal-extension = "open_data_portal_extension.cli:app"

[tool.fastapi]
entrypoint = "open_data_portal_extension.api.main:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff==0.17.5",
    "zensical>=0.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
