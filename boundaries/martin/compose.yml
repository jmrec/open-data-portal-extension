services:
  martin:
    image: ghcr.io/maplibre/martin:1.15.0
    container_name: "${MARTIN_CONTAINER_NAME:-martin}"
    # Add "--webui", "enable-for-all" to browse the sources.
    command: ["--config", "/config/config.yml"]
    ports:
      - "${MARTIN_PORT:-3080}:3080"
    volumes:
      - "../data/processed:/data:ro"
      - "./config.yml:/config/config.yml:ro"
