[project]
name = "ph-administrative-boundaries"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Miguel Recondo", email = "134484809+jmrec@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.29.2",
    "structlog>=26.1.0",
]

[project.scripts]
cli = "ph_administrative_boundaries.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
